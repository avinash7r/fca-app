name: Build and Push FCA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build server
        run: |
          docker build -t localhost:5000/fca-server:${{ github.run_number }} ./server
          docker push localhost:5000/fca-server:${{ github.run_number }}

      - name: Build client
        run: |
          docker build -t localhost:5000/fca-client:${{ github.run_number }} ./client
          docker push localhost:5000/fca-client:${{ github.run_number }}
