name: Build and Push FCA

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build server
        run: |
          docker build -t localhost:5000/fca-server:${{ github.run_number }} ./server
          docker push localhost:5000/fca-server:${{ github.run_number }}

      - name: Build client
        run: |
          docker build -t localhost:5000/fca-client:${{ github.run_number }} ./client
          docker push localhost:5000/fca-client:${{ github.run_number }}
    
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
    - name: Update GitOps repo
      env:
        # Pass secret to env to avoid exposure in logs/command history
        GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      run: |
        # 1. Clone using the token explicitly to verify auth immediately
        git clone https://oauth2:${GITOPS_TOKEN}@://
