name: fca-app

services:
  server:
    build: ./server
    expose:
      - "7777"
    env_file:
      - ./server/.env
    networks:
      - fca-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7777/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5

  client:
    build: ./client
    ports:
      - "5173:80"
    environment:
      - BACKEND_HOST=server
      - BACKEND_PORT=7777
    networks:
      - fca-network
    

networks:
  fca-network:
    driver: bridge
